org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
# Android Studio injects signing credentials as Gradle properties. Do not
# serialize them into the configuration cache during a local signed build.
org.gradle.configuration-cache=false

# Local Android Studio release versions; CI environment variables take priority.
FILMY_RELEASE_VERSION=1.0.0
FILMY_ANDROID_VERSION_CODE=1
