# Intentionally left without Daemon JVM criteria.
#
# A previous auto-generated version (from the updateDaemonJvm task) pinned the
# Gradle daemon to toolchainVendor=JETBRAINS / toolchainVersion=21. That JDK is
# not present on CI runners (Temurin 17) or most machines, so the build failed
# with: "Cannot find a Java installation ... matching: Compatible with Java 21,
# JetBrains (from gradle/gradle-daemon-jvm.properties)".
#
# Leaving no criteria here lets Gradle run on whatever JDK launches it (17+),
# which is all AGP 8.7 needs. You may also simply delete this file.
