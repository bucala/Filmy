<!DOCTYPE html>
<html lang="sk" data-skin="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0f">
<title>Marcelova Filmová Databáza</title>
<link rel="manifest" id="pwaManifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

<!-- HEADER -->
<header class="hdr" id="hdr">
  <div class="hdr-row1">
    <!-- Logo -->
    <div class="logo-wrap" id="logoWrap">
      <span class="logo-s">Marcelova</span>
      <span class="logo-t">Filmová Databáza</span>
    </div>

    <!-- Search -->
    <div class="hdr-srch">
      <input type="search" id="srch" placeholder="Hľadat film..." autocomplete="off">
      <span class="srch-badge" id="srchBadge"></span>
    </div>

    <!-- Controls: sort + filter + view -->
    <div class="hdr-controls">
      <!-- Sort pill -->
      <div class="sort-pill">
        <button id="sortDir" title="Smer radenia">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="5 12 12 19 19 12" id="sortArrow"/></svg>
        </button>
        <button id="sortCycle" title="Pole radenia">
          <span id="sortLbl">Rok</span>
        </button>
      </div>
      <!-- Filter -->
      <button id="btnFp" title="Pokročilý filter">
        <svg viewBox="0 0 24 24"><polygon points="3 5 10 13 10 21 14 19 14 13 21 5"/></svg>
        <span id="fpBadge" style="font-size:10px;display:none"></span>
      </button>
      <!-- View toggle -->
      <button id="viewTog" title="Prepínať zobrazenie">
        <svg id="viewIcon" viewBox="0 0 24 24">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
        </svg>
      </button>
    </div>

    <!-- Action buttons -->
    <div class="hdr-act">
      <button id="btnFav" title="Obľúbené">
        <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" stroke="currentColor" fill="none" stroke-width="2"/></svg>
      </button>
      <button id="btnWl" title="Watchlist">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M6.17 18.56A6 6 0 0 1 12 16a6 6 0 0 1 5.83 2.56"/></svg>
      </button>
      <button id="btnWatched" title="Videné">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
      <button id="btnRandom" title="Náhodný film">
        <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="3" ry="3"/><circle cx="8" cy="8" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1.5" fill="currentColor" stroke="none"/><circle cx="16" cy="8" r="1.5" fill="currentColor" stroke="none"/><circle cx="8" cy="16" r="1.5" fill="currentColor" stroke="none"/></svg>
      </button>
      <button id="btnStats" title="Štatistiky">
        <svg viewBox="0 0 24 24"><line x1="6" y1="20" x2="6" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="18" y1="20" x2="18" y2="14"/></svg>
      </button>
      <button id="btnSett" title="Nastavenia">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>

    <!-- Overflow menu button (mobile) -->
    <button id="btnOverflow" style="display:none;background:none;border:1px solid var(--border);border-radius:8px;color:var(--text2);cursor:pointer;padding:6px 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="19" r="1.5" fill="currentColor"/></svg>
    </button>
  </div>

  <!-- Filter pills row -->
  <div class="fp-pills" id="fpPills"></div>
  <!-- Genre chips (hidden, used by filter panel) -->
  <div class="fbar" id="fbar"></div>
  <!-- Batch progress bar -->
  <div class="batch-bar-wrap"><div class="batch-bar-fill" id="batchBar"></div></div>
</header>

<!-- MAIN CONTENT -->
<main class="scrnBody" id="scrnBody">
  <div class="mlist" id="mlist"></div>
  <p id="res-cnt" style="display:none"></p>
</main>

<!-- FAST SCROLL -->
<div class="fscroll" id="fscroll"><div class="fscroll-track"><div class="fscroll-thumb" id="fscrollThumb"></div></div></div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- OVERLAYS (rendered by JS) -->
<div id="detOvWrap"></div>
<div id="trOvWrap"></div>
<div id="statsOvWrap"></div>
<div id="settOvWrap"></div>
<div id="fpOvWrap"></div>
<div id="adminPanelSc" style="display:none"></div>
<div id="vlcOvWrap"></div>
<div id="drawerOvWrap"></div>

<!-- SETTINGS PANEL HTML -->
<div id="settOverlay" style="display:none">
  <div class="settOv" id="settBg"></div>
  <div class="settBox" id="settBox">
    <div class="sett-hdr">
      <span class="sett-hdr-title">⚙️ Nastavenia</span>
      <button class="sett-close-btn" id="settClose">&times;</button>
    </div>
    <div class="sett-body" id="settBody"></div>
  </div>
</div>

<!-- FILTER PANEL HTML -->
<div id="fpOverlay" style="display:none">
  <div class="fp-overlay" id="fpBg"></div>
  <div class="fp-panel" id="fpPanel">
    <div class="fp-hdr">
      <span class="fp-title">🔍 Pokročilý Filter</span>
      <button class="fp-close" id="fpClose">&times;</button>
    </div>
    <div id="fpBody"></div>
    <div class="fp-actions">
      <button class="fp-btn reset" id="fpReset">Vynulovať</button>
      <button class="fp-btn apply" id="fpApply">Použiť filtre</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
