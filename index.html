<!DOCTYPE html>
<html lang="sk" data-skin="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0f">
<title>Marcelova Filmová Databáza</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

<!-- ══ MAIN SCREEN ══ -->
<div id="mainSc">

<!-- HEADER -->
<div class="hdr" id="hdr">
  <div class="hdr-row1">
    <div class="logo-wrap" id="logoWrap">
      <span class="logo-s">Marcelova</span>
      <span class="logo-t">Filmová Databáza</span>
    </div>
    <div class="hdr-srch">
      <input type="search" id="srchInp" placeholder="Hľadať film..." autocomplete="off">
      <button id="srchClr" style="display:none;position:absolute;right:28px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:0">&times;</button>
      <span class="srch-mode-badge" id="srchModeBadge"></span>
    </div>
    <div class="hdr-controls">
      <div class="sort-pill">
        <select id="sortSel" style="display:none"></select>
        <button id="sortDir" title="Smer radenia"></button>
      </div>
      <button id="fpBtn" class="fp-btn" title="Pokročilý filter">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 5 10 13 10 21 14 19 14 13 21 5"/></svg>
        <span id="fpBadge" class="fp-badge"></span>
      </button>
      <button id="viewTog" title="Prepínať zobrazenie">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/></svg>
      </button>
    </div>
    <div class="hdr-act">
      <button id="btnFav" class="hdr-act-fav" title="Obľúbené">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </button>
      <button id="btnWl" class="hdr-act-wl" title="Watchlist">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
      <button id="btnWatched" class="hdr-act-watch" title="Videné">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
      <button id="btnRnd" title="Náhodný film">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="3" ry="3"/><circle cx="8" cy="8" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1.5" fill="currentColor" stroke="none"/><circle cx="16" cy="8" r="1.5" fill="currentColor" stroke="none"/><circle cx="8" cy="16" r="1.5" fill="currentColor" stroke="none"/></svg>
      </button>
      <button id="btnStat" title="Štatistiky">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="20" x2="6" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="18" y1="20" x2="18" y2="14"/></svg>
      </button>
      <button id="btnSett" title="Nastavenia">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>
  <div class="fp-pills" id="fpPills"></div>
  <div class="fbar" id="fbar"></div>
  <!-- Batch bar: hidden by default via .hidden class (requires style.css .hidden rule) -->
  <div id="batchBar" class="batch-bar hidden">
    <div id="batchFill" class="batch-bar-fill" style="width:0%"></div>
    <span id="batchInfo" class="batch-bar-info"></span>
    <button id="btnBatchStop">Stop</button>
  </div>
</div><!-- /hdr -->

<div id="loadSt" style="display:flex;align-items:center;justify-content:center;height:200px;color:var(--text2)">Načítavam...</div>

<div id="emptySt" style="display:none;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:16px">
  <div style="font-size:48px">🎬</div>
  <div style="color:var(--text2);font-size:16px">Databáza je prázdna</div>
  <button class="sett-btn" id="emptyBtnZip">📂 Importovať ZIP</button>
  <button class="sett-btn" id="emptyBtnPull">☁ Načítať z GitHubu</button>
</div>

<div id="noRes" style="display:none;flex-direction:column;align-items:center;padding:40px;color:var(--text2)">
  <div style="font-size:32px">🔍</div>
  <div id="noResTxt">Nič sa nenašlo</div>
</div>

<div id="scrnBody">
  <div class="mlist" id="mlist"></div>
  <div id="resCnt" style="padding:8px 16px;color:var(--text3);font-size:13px"></div>
</div>

</div><!-- /mainSc -->

<!-- ══ DETAIL SCREEN ══ -->
<div id="detSc" class="hidden">
  <div class="det-hdr">
    <button id="btnBack">← Späť</button>
    <div id="detTitle" class="det-title"></div>
  </div>
  <div class="det-hero">
    <img id="detBlur" class="det-blur" src="" alt="" style="display:none">
    <img id="detCover" class="det-cover" src="" alt="" style="display:none">
    <div id="detBg" class="det-bg-ph" style="display:none"></div>
    <div id="detInset" class="det-inset" style="display:none">
      <img id="detInsetImg" src="" alt="">
    </div>
  </div>
  <div class="det-meta"><div id="detYr" class="det-yr"></div></div>
  <div id="detBody" class="det-body"></div>
</div>

<!-- ══ STATS SCREEN ══ -->
<div id="statSc" class="hidden">
  <div class="det-hdr">
    <button id="btnStatCls">← Späť</button>
    <span style="font-weight:600">Štatistiky</span>
  </div>
  <div id="statBody" style="padding:16px"></div>
</div>

<!-- ══ ADMIN PANEL ══ -->
<div id="adminPanelSc" style="display:none">
  <div class="det-hdr">
    <button id="adminClose">← Späť</button>
    <span style="font-weight:600">Pridať film (TMDB)</span>
  </div>
  <div style="padding:16px">
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input id="adminSearchInp" type="text" placeholder="Názov alebo TMDB ID..." style="flex:1;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text)">
      <button id="adminSearchBtn" class="sett-btn">Hľadať</button>
    </div>
    <div id="adminStatus" class="admin-status"></div>
    <div id="adminResults"></div>
    <div id="adminPreview" class="admin-preview">
      <img id="adminPvPoster" src="" alt="" style="display:none">
      <div>
        <div id="adminPvTitle" style="font-weight:700;font-size:16px"></div>
        <div id="adminPvMeta" style="color:var(--text2);font-size:13px;margin:4px 0"></div>
        <div id="adminPvGenres"></div>
        <div id="adminPvDesc" style="color:var(--text2);font-size:13px;margin-top:8px"></div>
        <div style="display:flex;gap:8px;margin-top:12px">
          <button id="adminAddBtn" class="sett-btn primary">✅ Pridať do databázy</button>
          <button id="adminCancelBtn" class="sett-btn">Zrušiť</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ══ PROGRESS MODAL ══ -->
<div id="mOv" class="hidden">
  <div class="modal">
    <div id="mTtl"></div>
    <div id="mSub"></div>
    <div class="m-bar"><div id="mFill"></div></div>
    <div id="mStat"></div>
  </div>
</div>

<!-- ══ TRAILER OVERLAY ══ -->
<div id="trOv" class="hidden">
  <div class="tr-overlay-bg" id="trClose"></div>
  <div class="tr-wrap">
    <button class="tr-cls" onclick="document.getElementById('trOv').classList.add('hidden');document.getElementById('trFrame').src=''">&times;</button>
    <iframe id="trFrame" src="" frameborder="0" allow="autoplay;encrypted-media" allowfullscreen></iframe>
  </div>
</div>

<!-- ══ SETTINGS PANEL ══ -->
<!-- settOverlay = outer wrapper (hidden by default)
     sett-bg    = click-to-close backdrop
     sett-panel = the actual panel (stopPropagation prevents closing when clicking inside) -->
<div id="settOverlay" class="hidden" onclick="closeSett()">
  <div class="sett-bg"></div>
  <div class="sett-panel" id="settPanel" onclick="event.stopPropagation()">
    <div class="sett-hdr">
      <span>⚙️ Nastavenia</span>
      <button id="settCloseBtn" onclick="closeSett()">&times;</button>
    </div>
    <div class="sett-body" id="settBody">

      <div class="sett-section">
        <div class="sett-section-title">☁ GitHub Sync</div>
        <div class="sync-status" id="ghSyncStatus"></div>
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <input id="ghTokenInp" type="password" placeholder="ghp_... Personal Access Token" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:13px">
          <button id="ghTokenSave" class="sett-btn">Uložiť</button>
        </div>
        <div id="ghTokenSt" class="sett-key-st"></div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button id="ghPushBtn" class="sett-btn">⬆ Push</button>
          <button id="ghPullBtn" class="sett-btn">⬇ Pull</button>
        </div>
      </div>

      <div class="sett-section">
        <div class="sett-section-title">📂 Import</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button id="settBtnPdf" class="sett-btn">📄 Import ZIP/PDF</button>
          <button id="settBtnPdfUpdate" class="sett-btn">🔄 Aktualizovať DB</button>
        </div>
      </div>

      <div class="sett-section">
        <div class="sett-section-title">🖼 Zobrazenie</div>
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <button id="ttabList" class="ttab on" data-mode="list">☰ Zoznam</button>
          <button id="ttabGrid" class="ttab" data-mode="grid">⊞ Grid</button>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <label style="color:var(--text2);font-size:13px">Radenie:</label>
          <select id="settSortSel" style="padding:6px;border-radius:6px;border:1px solid var(--border);background:var(--card2);color:var(--text)">
            <option value="num">Poradové číslo</option>
            <option value="title">Názov A–Z</option>
            <option value="year">Rok</option>
            <option value="pct">Hodnotenie %</option>
          </select>
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
          <label style="color:var(--text2);font-size:13px">Auto-push:</label>
          <input type="checkbox" id="autoPushTog">
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
          <label style="color:var(--text2);font-size:13px">Natívny prehrávač:</label>
          <input type="checkbox" id="nativePlayerTog">
        </div>
      </div>

      <div class="sett-section">
        <div class="sett-section-title">🎬 TMDB API</div>
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <input id="tmdbKeyInp" type="password" placeholder="TMDB API kľúč" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:13px">
          <button id="tmdbEye" class="sett-btn">👁</button>
          <button id="tmdbSaveKey" class="sett-btn">Uložiť</button>
          <button id="tmdbDelKey" class="sett-btn">🗑</button>
        </div>
        <div id="tmdbKeySt" class="sett-key-st"></div>
        <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
          <div class="batch-progress"><div id="settPfill" style="height:100%;background:var(--gold);border-radius:4px;width:0%;transition:width .3s"></div></div>
          <span id="settBatchSt" style="font-size:12px;color:var(--text2)"></span>
        </div>
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
          <button id="settBtnBatch" class="sett-btn">▶ Načítať TMDB dáta</button>
          <button id="settBtnStop" class="sett-btn hidden">⏹ Stop</button>
          <button id="settBtnAdmin" class="sett-btn">➕ Pridať film</button>
        </div>
      </div>

      <div class="sett-section">
        <div class="sett-section-title">📁 Cesty k súborom</div>
        <div style="display:flex;gap:8px;margin-bottom:8px" id="pathModeToggle">
          <button class="ttab on" data-mode="smb">SMB</button>
          <button class="ttab" data-mode="local">Lokálny</button>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <input id="smbPathInp" type="text" placeholder="smb://server/share/" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:13px">
        </div>
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <input id="localPathInp" type="text" placeholder="W:\Movies\" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:13px">
          <button id="smbPathSave" class="sett-btn">Uložiť</button>
        </div>
        <div id="smbPathSt" class="sett-key-st"></div>
      </div>

      <div class="sett-section">
        <div class="sett-section-title">🎨 Téma & Farby</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
          <button class="skin-chip" data-skin="dark">Dark</button>
          <button class="skin-chip" data-skin="slate">Slate</button>
          <button class="skin-chip" data-skin="crimson">Crimson</button>
          <button class="skin-chip" data-skin="forest">Forest</button>
          <button class="skin-chip" data-skin="linen">Linen</button>
          <button class="skin-chip" data-skin="paper">Paper</button>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
          <button class="color-swatch" data-gold="#d4a943" data-gold2="#f0c060" style="background:#d4a943"></button>
          <button class="color-swatch" data-gold="#4a9eff" data-gold2="#88ccff" style="background:#4a9eff"></button>
          <button class="color-swatch" data-gold="#e85555" data-gold2="#ff8080" style="background:#e85555"></button>
          <button class="color-swatch" data-gold="#6ac840" data-gold2="#98f060" style="background:#6ac840"></button>
          <button class="color-swatch" data-gold="#cc55ff" data-gold2="#ee99ff" style="background:#cc55ff"></button>
          <button class="color-swatch" data-gold="#22ccaa" data-gold2="#66ffdd" style="background:#22ccaa"></button>
        </div>
        <input type="color" id="colorCustom" value="#d4a943" style="width:40px;height:32px;border:none;background:none;cursor:pointer">
      </div>

      <div class="sett-section">
        <div class="sett-section-title">ℹ Info</div>
        <div id="settInfoGrid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"></div>
      </div>

      <div class="sett-section">
        <div class="sett-section-title">💾 Export & Reset</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button id="settBtnExport" class="sett-btn">⬇ Export HTML</button>
          <button id="settBtnClearLive" class="sett-btn">🗑 Vymazať TMDB cache</button>
          <button id="settBtnClearAll" class="sett-btn" style="color:#e53935">⚠ Vymazať VŠETKO</button>
        </div>
      </div>

    </div><!-- /settBody -->
  </div><!-- /settPanel -->
</div><!-- /settOverlay -->

<!-- ══ FILTER PANEL ══ -->
<div id="fpOverlay" class="hidden">
  <div class="fp-ov-bg" onclick="closeFp()"></div>
  <div class="fp-panel" id="fpPanel">
    <div class="fp-hdr">
      <span>🔍 Pokročilý Filter</span>
      <button id="fpClose">&times;</button>
    </div>
    <div id="fpBody" style="padding:12px 16px;overflow-y:auto;flex:1">
      <div style="margin-bottom:12px">
        <label style="font-size:12px;color:var(--text2)">ROK OD</label>
        <input id="fpYearFrom" type="number" placeholder="napr. 1990" style="width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--card2);color:var(--text);margin-top:4px">
      </div>
      <div style="margin-bottom:12px">
        <label style="font-size:12px;color:var(--text2)">ROK DO</label>
        <input id="fpYearTo" type="number" placeholder="napr. 2024" style="width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--card2);color:var(--text);margin-top:4px">
      </div>
      <div style="margin-bottom:12px">
        <label style="font-size:12px;color:var(--text2)">MIN. HODNOTENIE: <span id="fpRatingVal">0%</span></label>
        <input id="fpRatingSlider" type="range" min="0" max="100" value="0" style="width:100%;margin-top:4px;accent-color:var(--gold)">
      </div>
      <div style="margin-bottom:12px">
        <label style="font-size:12px;color:var(--text2)">KRAJINA</label>
        <select id="fpCountry" style="width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--card2);color:var(--text);margin-top:4px"></select>
      </div>
      <div>
        <label style="font-size:12px;color:var(--text2)">ŽÁNRE</label>
        <div id="fpGenreChips" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px"></div>
      </div>
    </div>
    <div class="fp-actions">
      <button class="fp-btn reset" id="fpReset">Vynulovať</button>
      <button class="fp-btn apply" id="fpApply">Použiť filtre</button>
    </div>
  </div>
</div>

<!-- FILE INPUTS -->
<input type="file" id="fileInp" accept=".zip,.pdf" style="display:none">
<input type="file" id="fileInpUpdate" accept=".zip,.pdf" style="display:none">

<!-- FAST SCROLL -->
<div class="fscroll" id="fscroll"><div class="fscroll-track"><div class="fscroll-thumb" id="fscrollThumb"></div></div></div>

<!-- TOAST -->
<div class="toast" id="toast" style="display:none"></div>

<script src="data.js"></script>
<script src="app.js"></script>

<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js")
      .then(function(r){ console.log("[SW] registered", r.scope); })
      .catch(function(e){ console.warn("[SW] failed", e); });
  });
}
</script>
</body>
</html>
