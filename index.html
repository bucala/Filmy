<!DOCTYPE html>
<html lang="sk" data-skin="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Marcelova Filmová Databáza</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link id="pwaManifest" rel="manifest" href="">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

<!-- ══ HEADER ══════════════════════════════════════════════════════ -->
<header id="hdr">
  <div class="hdr-row1">
    <div class="logo" id="logoBtn">
      <span class="logo-s">MARCELOVA</span>
      <span class="logo-t">FILMOVÁ DATABÁZA</span>
    </div>
    <div class="hdr-srch">
      <input id="srch" type="search" placeholder="Hľadaj film…" autocomplete="off">
      <span id="fzBadge" class="fz-badge" style="display:none"></span>
    </div>
    <div class="hdr-controls">
      <div class="sort-pill">
        <button id="sortDir" class="sort-dir-btn" title="Zmeniť smer">↓</button>
        <button id="sortCycle" class="sort-cycle-btn"><span id="sortLbl">Rok</span> ▾</button>
      </div>
      <select id="sortSel" style="display:none">
        <option value="num">Por.</option>
        <option value="year" selected>Rok</option>
        <option value="title">A–Z</option>
        <option value="rating">%</option>
      </select>
      <button id="fpBtn" class="hdr-icon-btn" title="Pokročilý filter">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
        </svg>
        <span id="fpBadge" class="fp-badge" style="display:none">0</span>
      </button>
      <button id="viewTog" class="hdr-icon-btn" title="Prepnúť zobrazenie">
        <svg id="viewIco" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
        </svg>
      </button>
    </div>
    <div class="hdr-actions" id="hdrActions">
      <button id="btnFav" class="hdr-act" title="Obľúbené">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </button>
      <button id="btnWl" class="hdr-act" title="Watchlist">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
      <button id="btnWatched" class="hdr-act" title="Videné filmy">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </button>
      <button id="btnRandom" class="hdr-act" title="Náhodný film">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="3"/>
          <circle cx="8" cy="8" r="1.5" fill="currentColor"/>
          <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
          <circle cx="16" cy="16" r="1.5" fill="currentColor"/>
        </svg>
      </button>
      <button id="btnStats" class="hdr-act" title="Štatistiky">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6"  y1="20" x2="6"  y2="14"/>
        </svg>
      </button>
      <button id="btnSett" class="hdr-act sett-btn-ico" title="Nastavenia">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </div>
  <!-- Active filter pills row -->
  <div class="fp-pills-row" id="fpPills"></div>
  <!-- Genre chips (hidden, used by filter panel JS) -->
  <div class="fbar" id="fbar" style="display:none"></div>
</header>

<!-- ══ MAIN CONTENT ════════════════════════════════════════════════ -->
<main id="scrnBody">
  <div id="mlist" class="mlist grid"></div>
  <div id="resCnt" class="res-cnt" style="display:none"></div>
</main>

<!-- ══ FAST SCROLL ════════════════════════════════════════════════ -->
<div id="fscroll" class="fscroll"></div>

<!-- ══ DETAIL OVERLAY ════════════════════════════════════════════ -->
<div id="detOv" class="det-ov" style="display:none">
  <div id="detPanel" class="det-panel">
    <button id="detClose" class="det-close">✕</button>
    <div id="detBody" class="det-body"></div>
  </div>
</div>

<!-- ══ FILTER PANEL ════════════════════════════════════════════════ -->
<div id="fpOverlay" class="fp-overlay" style="display:none"></div>
<div id="fpPanel" class="fp-panel" style="display:none">
  <div class="fp-hdr">
    <span class="fp-title">Pokročilý filter</span>
    <button id="fpReset" class="fp-reset-btn">Zrušiť filtre</button>
    <button id="fpClose" class="fp-close">✕</button>
  </div>
  <div class="fp-body">
    <div class="fp-sec">
      <label class="fp-lbl">Žánre</label>
      <div id="fpGenres" class="fp-genre-grid"></div>
    </div>
    <div class="fp-sec">
      <label class="fp-lbl">Rok vydania</label>
      <div class="fp-row">
        <input id="fpYearFrom" class="fp-inp" type="number" placeholder="od" min="1900" max="2030">
        <span class="fp-dash">–</span>
        <input id="fpYearTo" class="fp-inp" type="number" placeholder="do" min="1900" max="2030">
      </div>
    </div>
    <div class="fp-sec">
      <label class="fp-lbl">Min. TMDB hodnotenie: <span id="fpRatVal">0</span>%</label>
      <input id="fpRating" type="range" min="0" max="100" value="0" class="fp-slider">
    </div>
    <div class="fp-sec">
      <label class="fp-lbl">Krajina</label>
      <select id="fpCountry" class="fp-sel"><option value="">Všetky krajiny</option></select>
    </div>
  </div>
</div>

<!-- ══ SETTINGS OVERLAY ════════════════════════════════════════════ -->
<div id="settOverlay" class="sett-ov" style="display:none">
  <div class="sett-panel" id="settPanel">
    <div class="sett-hdr">
      <span class="sett-title">Nastavenia</span>
      <button id="settClose" class="sett-close">✕</button>
    </div>
    <div id="settBody" class="sett-body"></div>
  </div>
</div>

<!-- ══ STATS OVERLAY ═══════════════════════════════════════════════ -->
<div id="statsOv" class="stats-ov" style="display:none">
  <div class="stats-panel">
    <div class="stats-hdr">
      <span class="stats-title">Štatistiky</span>
      <button id="statsClose" class="sett-close">✕</button>
    </div>
    <div id="statsBody" class="stats-body"></div>
  </div>
</div>

<!-- ══ MODAL (progress / confirm) ══════════════════════════════════ -->
<div id="modOv" class="m-ov" style="display:none">
  <div class="modal">
    <div id="modTitle" class="m-ttl"></div>
    <div id="modSub"   class="m-sub"></div>
    <div class="m-bar"><div id="modFill" class="m-fill" style="width:0%"></div></div>
    <div id="modStat"  class="m-stat"></div>
    <div id="modBtns"  class="m-btns"></div>
  </div>
</div>

<!-- ══ ADMIN PANEL ══════════════════════════════════════════════════ -->
<div id="adminPanelSc" class="admin-ov" style="display:none">
  <div class="admin-panel">
    <div class="admin-hdr">
      <span class="admin-title">TMDB Admin Panel</span>
      <button id="adminClose" class="sett-close">✕</button>
    </div>
    <div class="admin-body">
      <div class="admin-search-row">
        <input id="adminQ" class="sett-key-inp" type="text" placeholder="Názov alebo TMDB ID…">
        <button id="adminSearch" class="sett-btn primary">Hľadať</button>
      </div>
      <div id="adminResults" class="admin-results"></div>
      <div id="adminPreview" class="admin-preview" style="display:none">
        <div id="adminPreviewInner"></div>
        <button id="adminAdd" class="sett-btn success" style="margin-top:12px;width:100%">Pridať do databázy</button>
      </div>
    </div>
  </div>
</div>

<!-- ══ TOAST ════════════════════════════════════════════════════════ -->
<div id="toastEl" class="toast" style="display:none"></div>

<!-- ══ SCRIPTS ══════════════════════════════════════════════════════ -->
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
