name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android-app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "index.html"
      - "app.js"
      - "style.css"
      - "data.js"
      - "data.json"
      - "sw.js"
      - "manifest.webmanifest"
      - ".github/workflows/android-build.yml"
  push:
    branches:
      - Perplexity
      - main
    paths:
      - "android-app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "index.html"
      - "app.js"
      - "style.css"
      - "data.js"
      - "data.json"
      - "sw.js"
      - "manifest.webmanifest"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle :android-app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: filmy-debug-apk
          path: android-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
